[project]
name = "perceptual-bias"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Param Shah", email = "shahparam87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fredapi>=0.5.2",
    "gdeltdoc>=1.12.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
perceptual-bias = "perceptual_bias:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
